[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthos"
version = "2.0.0"
description = "Personal AI desktop assistant with voice interaction, multi-LLM support, and PyQt6 HUD"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ankur" },
]
keywords = ["ai", "assistant", "voice", "llm", "desktop", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core UI & system
    "PyQt6",
    "PyQt6-WebEngine",
    "markdown-it-py",
    "matplotlib",
    "psutil",
    "pillow",
    "sounddevice",
    "numpy",
    "soundfile",
    "requests",

    # Web automation & search
    "playwright",
    "beautifulsoup4",
    "duckduckgo-search",

    # OS control (cross-platform)
    "pyautogui",
    "pyperclip",
    "pygetwindow",
    "send2trash",
    "mss",
    "opencv-python",

    # Media & file processing
    "youtube-transcript-api",
    "python-pptx",
    "miniaudio",
    "PyMuPDF",

    # STT
    "faster-whisper",

    # TTS
    "edge-tts",

    # Vector search
    "chromadb",
    "sentence-transformers",

    # Memory service
    "fastapi",
    "uvicorn",
    "pydantic",
    "msgpack",

    # Telegram bot
    "python-telegram-bot",

    # Logging & observability
    "loguru",
    "prometheus-client",

    # MCP Client
    "mcp>=1.27,<2",

    # Gemini Live API
    "google-genai",
]

[project.optional-dependencies]
windows = [
    "pywinauto",
    "comtypes",
    "uiautomation",
    "pycaw",
    "win10toast",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
kokoro = ["kokoro"]
elevenlabs = ["elevenlabs"]
vosk = ["vosk"]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-requests",
]

[project.scripts]
orthos = "main:main"

[project.urls]
Repository = "https://github.com/Ankur1103/Orthos"

[tool.setuptools.packages.find]
include = ["core*", "memory*", "gateway*", "actions*", "agent*", "config*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
